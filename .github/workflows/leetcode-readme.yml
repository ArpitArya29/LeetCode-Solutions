name: Generate LeetCode Problem README

on:
  push:
    branches:
      - main
    paths:
      - "**/*.java"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.cs"
      - "**/*.go"
      - "**/*.rs"

  workflow_dispatch:

concurrency:
  group: leetcode-readme-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate README
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/generate-leetcode-readme.js
